plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pigeontechies.pst'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pigeontechies.pst'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.1.1'
    }

    signingConfigs {
        release {
            storeFile file(providers.environmentVariable('PST_KEYSTORE_PATH').getOrElse('release-key.p12'))
            storeType 'PKCS12'
            storePassword providers.environmentVariable('PST_KEYSTORE_PASSWORD').getOrElse('')
            keyAlias providers.environmentVariable('PST_KEY_ALIAS').getOrElse('')
            keyPassword providers.environmentVariable('PST_KEY_PASSWORD').getOrElse('')
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".test"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
