name: PST Cross-Platform Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile PST modules
        run: python -m py_compile pst.py pigeon_portscan.py pigeon_history.py

      - name: Run command-line tests
        run: python -m unittest discover -s tests -v

      - name: Verify version command
        run: python pst.py --version

      - name: Verify help command
        run: python pst.py --help

      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\install-windows.ps1

          $Launcher = Join-Path $env:LOCALAPPDATA "Programs\PST\pst.cmd"

          if (-not (Test-Path $Launcher)) {
              throw "PST launcher was not created."
          }

          $Output = & $Launcher --version

          if ($LASTEXITCODE -ne 0) {
              throw "PST launcher failed."
          }

          if (($Output -join "`n") -notmatch 'PST\s+\d+\.\d+') {
              throw "PST version output was not detected."
          }

          Write-Host "Windows installer test passed."
