name: Build PST Signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PST_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pst-release-key.p12"
          chmod 600 "$RUNNER_TEMP/pst-release-key.p12"

      - name: Build signed release APK
        env:
          PST_KEYSTORE_PATH: ${{ runner.temp }}/pst-release-key.p12
          PST_KEYSTORE_PASSWORD: ${{ secrets.PST_KEYSTORE_PASSWORD }}
          PST_KEY_ALIAS: ${{ secrets.PST_KEY_ALIAS }}
          PST_KEY_PASSWORD: ${{ secrets.PST_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Pigeon-Security-Toolkit-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
